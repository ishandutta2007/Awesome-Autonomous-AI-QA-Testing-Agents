<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filter for soft glows -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Dynamic Background) -->
  <circle cx="200" cy="120" r="180" fill="url(#glowGrad1)" filter="url(#blurFilter)">
    <animate attributeName="cx" values="180;260;180" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;160;100" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="300" r="220" fill="url(#glowGrad2)" filter="url(#blurFilter)">
    <animate attributeName="cx" values="1050;960;1050" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="320;250;320" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- High-tech Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Dynamic Circuit / Wave Lines -->
  <path d="M 50 360 Q 300 390 600 340 T 1150 350" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" values="0;100" dur="15s" repeatCount="indefinite" />
  </path>
  <path d="M 50 80 Q 400 30 750 90 T 1150 70" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="100;0" dur="20s" repeatCount="indefinite" />
  </path>

  <!-- Dynamic Status Indicator Nodes (Subtle, Background) -->
  <g opacity="0.6">
    <circle cx="1060" cy="80" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="330" r="5" fill="#a855f7">
      <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== FOREGROUND CONTENT ==================== -->
  <g id="foreground">
    <!-- Top Pill / Badge -->
    <g transform="translate(600, 75)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)"/>
      <circle cx="-160" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-142" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">AUTONOMOUS QUALITY ENGINEERING</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Autonomous AI QA
    </text>
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
      &amp; Testing Agents ⚡
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated platforms, self-healing frameworks, test synthesizers &amp; LLM-eval agents
    </text>

    <!-- Interactive / Highlighting Feature Badges Bar -->
    <g transform="translate(240, 310)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="82.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 Autonomous Agents</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="82.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🩺 Self-Healing Tests</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="175" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="87.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">👁️ Vision &amp; E2E Testing</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(550, 0)">
        <rect x="0" y="0" width="170" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="85" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📊 LLM-as-a-Judge</text>
      </g>
    </g>
  </g>
</svg>
